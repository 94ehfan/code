version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://draft:draft@postgres:5432/ticketdraft
      - SECRET_KEY=dev-secret-change-in-production
      - APP_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=draft
      - POSTGRES_PASSWORD=draft
      - POSTGRES_DB=ticketdraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draft -d ticketdraft"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
